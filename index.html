  <title>Moonfall — The Hollow Bell</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
    :root{--ink:#f4efe6;--muted:#a9a7ae;--night:#10131c;--panel:#191d29;--panel2:#202534;--line:#343949;--gold:#e8bc78;--rose:#e8a4ab;--mint:#9bd3c0;--blue:#92b8e4;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace}

    .layout{display:grid;grid-template-columns:265px minmax(0,1fr);gap:22px;align-items:start}.sidebar{display:flex;flex-direction:column;gap:14px}.card{background:linear-gradient(145deg,#202432,#181b26);border:1px solid #343847;border-radius:13px;overflow:hidden}.profile{padding:18px}.section-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:#9497a4}.portrait-wrap{margin:17px auto 15px;position:relative;width:126px;height:126px;border-radius:50%;padding:5px;background:linear-gradient(145deg,#d9aa77,#51485f 55%,#a46778);box-shadow:0 9px 40px #d3887030}.portrait{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#eac1a3 0 16%,transparent 16.8%),radial-gradient(ellipse at 50% 83%,#313a58 0 29%,transparent 29.8%),radial-gradient(ellipse at 50% 43%,#aa7180 0 31%,transparent 31.7%),radial-gradient(ellipse at 50% 23%,#302d42 0 34%,transparent 35%),linear-gradient(145deg,#47445c,#222737);position:relative;overflow:hidden}.portrait:before{content:'';position:absolute;top:31px;left:34px;width:51px;height:16px;border-top:6px solid #312936;border-radius:50%;transform:rotate(-5deg);filter:drop-shadow(0 1px 0 #e7bd9e)}.portrait:after{content:'·   ·';white-space:pre;position:absolute;left:40px;top:47px;color:#40333c;font-size:16px;letter-spacing:7px}.portrait .glint{position:absolute;left:61px;top:68px;width:9px;height:3px;border-radius:50%;background:#a25e6e}.portrait-tag{position:absolute;bottom:2px;right:2px;background:#252a38;border:1px solid #505467;border-radius:20px;padding:4px 7px;font:9px var(--mono);color:var(--gold)}.hero-name{font:600 23px var(--serif);text-align:center;line-height:1.15}.hero-title{text-align:center;color:#aaa9b1;font-size:11px;margin-top:5px}.trait-line{text-align:center;margin:15px 0 0;font-size:11px;color:#d6c6bd}.traits{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}.trait{padding:4px 7px;border-radius:20px;background:#ffffff0a;border:1px solid #ffffff12;f     .stats{padding:16px 17px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.score-cap{font:9px var(--mono);color:#858996}.stat{margin:12px 0}.stat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.stat-name{font-size:11px;color:#d1ced0}.stat-value{font:11px var(--mono);color:#f3d9b2}.stat-track{height:4px;background:#363a47;border-radius:5px;overflow:hidden}.stat-fill{height:100%;border-radius:5px;transition:width .5s ease;background:linear-gradient(90deg,#9a7888,#e8bc78)}.stat-note{font:9px var(--mono);color:#787d89;margin-top:11px}.inventory{padding:16px 17px}.equip-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff0b}.equip-row:last-child{border-bottom:0;padding-bottom:0}.equip-icon{width:28px;height:28px;display:grid;place-items:center;border:1px solid #454453;background:#ffffff06;border-radius:7px;font-size:14px}.equip-meta{min-width:0}.equip-slot{font:8px var(--mono);letter-spacing:.12em;color:#838795;text-transform:uppercase}.equip-name{font-size:10px;color:#d8d1cf;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty-equip{color:#777b86;font-style:italic}
    .main{min-width:0}.chapter-line{display:flex;align-items:center;gap:11px;margin:2px 3px 14px}.chapter-no{font:10px var(--mono);color:var(--gold);letter-spacing:.1em}.chapter-rule{height:1px;flex:1;background:linear-gradient(90deg,#66564d,transparent)}.chapter-name{font:10px var(--mono);color:#999ba4;letter-spacing:.1em;text-transform:uppercase}.story-card{min-height:590px;padding:clamp(23px,4vw,48px);position:relative;background:linear-gradient(145deg,#222431 0%,#1b1d28 65%,#211f2b 100%);border:1px solid #3c3b4b;border-radius:14px;box-shadow:0 20px 70px #0002;overflow:hidden}.story-card:before{content:'';position:absolute;right:-110px;top:-140px;width:370px;height:370px;border-radius:50%;border:1px solid #f1d7bc0b;box-shadow:0 0 0 32px #f1d7bc05,0 0 0 64px #f1d7bc03;pointer-events:none}.story-inner{max-width:760px;position:relative}.eyebrow{font:10px var(--mono);letter-spacing:.16em;color:var(--rose);text-transform:uppercase;margin-bottom:12px}.story-title{font:600 clamp(28px,4vw,43px)/1.14 var(--serif);letter-spacing:-.025em;margin:0 0 20px;max-width:680px}.story-copy{font-size:14px;line-height:1.85;color:#d2cfd0;max-width:700px}.story-copy p{margin:0 0 15px}.story-copy em{font-family:var(--serif);color:#f0d7c1}.story-copy strong{color:#f0d7c1;font-weight:600}.scene-art{float:right;width:150px;height:150px;margin:0 8px 12px 25px;border:1px solid #b98f8450;border-radius:50%;display:grid;place-items:center;position:relative;color:#d7ac97;background:radial-gradient(circle,#d49d9730 0,transparent 70%);font-size:52px}.scene-art:before,.scene-art:after{content:'';position:absolute;border:1px solid #e8bc7828;border-radius:50%;inset:10px}.scene-art:after{inset:-9px;border-style:dashed;opacity:.5}.choices{display:grid;gap:9px;margin-top:28px}.choice{width:100%;display:flex;align-items:center;text-align:left;gap:14px;padding:14px 16px;border:1px solid #454655;background:#ffffff05;border-radius:9px;cursor:pointer;transition:all .18s}.choice:hover{background:#ffffff0b;border-color:#bb9b83;transform:translateY(-1px)}.choice:disabled{opacity:.5;cursor:default;transform:none}.choice-key{font:10px var(--mono);color:var(--gold);border:1px solid #776353;border-radius:5px;padding:5px 7px;flex:0 0 auto}.choice-text{font-size:12px;color:#e5e0dc}.choice-hint{margin-left:auto;font:9px var(--mono);color:#9695a0;white-space:nowrap}.roll-result{margin-top:16px;padding:12px 14px;border:1px solid #b48c6760;background:#e8bc780b;border-radius:8px;font:11px/1.6 var(--mono);color:#e9cfaa}.roll-result.success{border-color:#7bb99b60;background:#78c7a20b;color:#b8e0cb}.roll-result.fail{border-color:#d9898960;background:#d989890b;color:#edb9b9}.story-footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid #ffffff10;color:#878994;font:9px var(--mono);letter-spacing:.06em}.chapter-progress{display:flex;gap:4px}.progress-dot{width:15px;height:3px;background:#424450;border-radius:4px}.progress-dot.done{background:#d6ab7b}.overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:#090b11dc;backdrop-filter:blur(8px)}.modal{width:min(620px,100%);max-height:min(92vh,780px);overflow:auto;background:linear-gradient(145deg,#232533,#171a24);border:1px solid #504857;border-radius:15px;padding:clamp(23px,5vw,40px);box-shadow:0 25px 100px #0009}.modal-kicker{font:10px var(--mono);color:var(--rose);letter-spacing:.17em;text-transform:uppercase}.modal h1{font:600 clamp(31px,6vw,48px)/1.05 var(--serif);margin:12px 0}.modal p{font-size:13px;line-height:1.7;color:#c0bdc2}.form-label{display:block;color:#a6a4ad;font:9px var(--mono);letter-spacing:.13em;text-transform:uppercase;margin:19px 0 8px}.name-input{width:100%;border:1px solid #4b4c5a;background:#11141d;border-radius:8px;padding:12px 13px;color:white;outline:none}.name-input:focus{border-color:#c49b78}.option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.select-option{border:1px solid #484957;background:#ffffff05;border-radius:8px;padding:11px 9px;text-align:left;cursor:pointer}.select-option.selected{border-color:#d8ac7b;background:#d8ac7b12}.select-option b{display:block;font:12px var(--serif);margin-bottom:4px}.select-option small{font-size:9px;line-height:1.45;color:#aaa8b1}.primary{border:0;border-radius:8px;background:linear-gradient(110deg,#d4a778,#e9bf88);color:#241b1b;padding:13px 17px;font-weight:700;font-size:12px;cursor:pointer}.primary:hover{filter:brightness(1.08)}.wide{width:100%;margin-top:22px}.mini-note{font:9px/1.6 var(--mono)!important;color:#888b96!important;margin-top:12px!important}.modal-actions{display:flex;gap:10px}.modal-actions .primary{flex:1}.equip-reaction{border-left:2px solid #d5ab7c;padding:12px 15px;margin-top:16px;color:#ded3cb;font:italic 14px/1.7 var(--serif);background:#ffffff05}.journal-entry{border-bottom:1px solid #ffffff12;padding:11px 0;color:#c5c1c2;font-size:12px;line-height:1.65}.journal-entry:last-child{border:0}.journal-time{font:9px var(--mono);color:#d5ab7c;display:block;margin-bottom:4px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);padding:10px 15px;border:1px solid #686071;background:#262632;border-radius:8px;color:#e8d9cb;font-size:11px;opacity:0;transition:.25s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.setup-screen{min-height:80vh;display:grid;place-items:center}.setup-modal{width:min(650px,100%)}.ending-badge{display:inline-block;margin:5px 0;padding:5px 8px;border:1px solid #b7a074;color:#e3c88e;border-radius:5px;font:9px var(--mono);letter-spacing:.1em}
    @media(max-width:850px){.shell{padding:18px 18px 30px}.layout{grid-template-columns:220px minmax(0,1fr);gap:14px}.portrait-wrap{width:105px;height:105px}.story-card{padding:27px;min-height:550px}.scene-art{width:112px;height:112px;font-size:40px}}
    @media(max-width:650px){.shell{padding:12px 12px calc(88px + env(safe-area-inset-bottom))}.topbar{height:36px;margin-bottom:15px}.edition{display:none}.brand{font-size:10px}.layout{display:flex;flex-direction:column-reverse;gap:12px}.main,.sidebar{width:100%}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:9px}.profile{grid-column:1/-1;display:grid;grid-template-columns:66px 1fr;align-items:center;padding:11px 13px}.profile .section-label{grid-column:1/-1}.portrait-wrap{width:55px;height:55px;margin:8px 0 0}.portrait:before{top:12px;left:14px;width:25px;height:12px;border-top-width:4px}.portrait:after{left:15px;top:25px;font-size:10px;letter-spacing:5px}.portrait .glint{left:25px;top:35px;width:6px}.portrait-tag{font-size:7px;padding:2px 4px}.profile-info{text-align:left;padding-left:9px}.hero-name{text-align:left;font-size:19px}.hero-title{text-align:left;font-size:10px}.trait-line,.traits{display:none}.stats,.inventory{padding:11px}.stats .card-head,.inventory .card-head{margin-bottom:8px}.stat{margin:8px 0}.stat-note{display:none}.equip-row{padding:6px 0;gap:6px}.equip-icon{width:24px;height:24px}.equip-name{font-size:9px}.chapter-line{margin:0 3px 10px}.story-card{padding:22px 18px;min-height:0}.story-title{font-size:30px;margin-bottom:13px}.story-copy{font-size:13px;line-height:1.75}.scene-art{width:82px;height:82px;font-size:30px;margin:0 2px 5px 13px}.scene-art:before{inset:6px}.scene-art:after{inset:-5px}.choices{margin-top:20px;gap:7px}.choice{padding:12px 10px;gap:9px}.choice-hint{display:none}.choice-text{font-size:11px}.story-footer{margin-top:18px}.top-actions .quiet-btn{font-size:10px;padding:6px 9px}.option-grid{grid-template-columns:1fr}.select-option{padding:9px}.select-option b{display:inline;margin-right:8px}.select-option small{font-size:9px}.modal{padding:24px 20px}.modal h1{font-size:36px}}

<body>
  <div id="app"></div>
  <script>
const $=s=>document.querySelector(s);
    const archetypes={wanderer:{label:'Wayfarer',desc:'A patient traveler who notices what others miss.',stats:{might:410,grace:540,wit:600,heart:450}},duelist:{label:'Moonblade',desc:'A quick-handed fighter with a promise to keep.',stats:{might:610,grace:620,wit:420,heart:390}},oracle:{label:'Shrine-touched',desc:'A soft-spoken listener to the unseen.',stats:{might:380,grace:440,wit:610,heart:630}}};
    const qualities={bright:{label:'Bright-eyed',desc:'Hope comes easily, even here.',mod:{heart:55,wit:25}},guarded:{label:'Guarded',desc:'You trust your own instincts first.',mod:{grace:45,might:25}},wry:{label:'Wry',desc:'A crooked smile is your favorite armor.',mod:{wit:35,heart:35}}};
    const statNames={might:'Might',grace:'Grace',wit:'Insight',heart:'Spirit'};
    const state={started:false,name:'',archetype:'wanderer',quality:'bright',base:{},gear:{weapon:null,charm:null,coat:null},scene:'gate',step:0,log:[],ending:false};
    const items={moonsteel:{name:'Moonsteel Tanto',icon:'🗡',slot:'weapon',bonus:{might:90,grace:35},reaction:'The cool hilt settles into your palm. Your brows lift; then your mouth sets in a small, fearless line. The blade catches your reflection—and your eyes look a little more certain.'},bell:{name:'Foxfire Bell',icon:'🔔',slot:'charm',bonus:{heart:75,wit:55},reaction:'The tiny bell warms against your throat. You blink at its soft blue glow, and a surprised, almost shy smile slips across your face.'},mantle:{name:'Mothwing Mantle',icon:'🧥',slot:'coat',bonus:{grace:80,heart:30},reaction:'The mantle spills over your shoulders like midnight silk. You turn once, testing its weight; your cheeks pink, and an impressed grin wins out.'},oni:{name:'Oni-Bone Guard',icon:'🛡',slot:'coat',bonus:{might:80,heart:40},reaction:'The lacquered guard clicks into place. You wince at the weight, then meet your own gaze with a stubborn little smirk.'}};
    const scenes={
      gate:{chapter:'Prologue · The Last Train',eyebrow:'01 / The threshold',title:'Where the moon has fallen',art:'☾',text:`The last train leaves you at <em>Tsukigane Station</em>, a village erased from every map. Above the cedar roofs, the moon hangs cracked like porcelain. Its missing shard is said to sleep beneath the old mountain shrine.\n\nAt the forest’s edge, a stone stairway descends into the dark. Your <strong>first step</strong> will tell the dungeon what kind of soul has come knocking.`,choices:[{text:'Study the old warding marks before you descend.',hint:'Insight check',stat:'wit',pass:'The faded strokes resolve into a map. You spot a safe passage—and an offering left for a careful guest.',fail:'The ink shifts when you stare at it. You choose a path by instinct, and the trees seem to lean closer.',next:'shrine',gain:'bell',roll:true},{text:'Take the steps two at a time; hesitation is its own trap.',hint:'Grace check',stat:'grace',pass:'You slip past the first snare as if the shadows had held the door for you.',fail:'A thread catches your ankle. You land hard, but a quick roll keeps the fall from doing worse.',next:'shrine',roll:true}]},
      shrine:{chapter:'Act I · The listening dark',eyebrow:'02 / The offering hall',title:'A bell with no clapper',art:'⛩',text:`A fox shrine stands in a flooded chamber. Three paper lanterns burn with blue flame, though no wick remains. At its feet rests a tiny silver bell.\n\nFrom somewhere behind the altar, a child hums the tune playing on your old station’s departure board. The melody ends on a note that feels like a question.`,choices:[{text:'Offer a memory, and take the bell in return.',hint:'Accept the foxfire bell',stat:'heart',pass:'A warm light blooms in the fox’s stone eyes. The hum becomes a quiet thank-you.',fail:'The memory slips away before you can name it. The shrine accepts the silence anyway.',next:'guardian',item:'bell',bonus:true},{text:'Bow to the shrine, then follow the sound beyond it.',hint:'Spirit check',stat:'heart',pass:'The fox bows back. Somewhere ahead, a door unlocks with a soft chime.',fail:'The lantern flames gutter. You leave with the uneasy feeling that something followed.',next:'guardian',roll:true}]},
      guardian:{chapter:'Act I · The listening dark',eyebrow:'03 / The paper garden',title:'A hundred watching eyes',art:'狐',text:`Paper foxes stir among the bamboo. Their painted eyes turn toward you all at once. One steps forward, wearing a little red scarf.\n\nIt speaks with the voice of someone you almost remember: <em>“The mountain is hungry. What will you feed it?”</em> The foxes begin to circle.`,choices:[{text:'Hold your ground. The mountain can wait its turn.',hint:'Might check',stat:'might',pass:'Your steady stance makes the foxes hesitate. The red-scarved one lowers its head in respect.',fail:'The swarm knocks you back. Still, you rise before they can decide what to do with you.',next:'armory',roll:true},{text:'Answer with the station’s forgotten departure song.',hint:'Insight check',stat:'wit',pass:'The foxes join the melody. The paper garden parts like a curtain.',fail:'Your voice catches on the last note. The foxes part anyway—though one keeps your shadow.',next:'armory',roll:true}]},
      armory:{chapter:'Act II · The hollow mountain',eyebrow:'04 / The moonlit forge',title:'A blade that remembers',art:'⚔',text:`Beyond the garden, a smithy glows beneath a ceiling of black glass. No smith is there—only a single short blade laid across an anvil. Silver veins shimmer along its edge.\n\nThe weapon’s reflection doesn’t match your movement. It gives you a little nod.`,choices:[{text:'Take the blade. You have a feeling it chose you first.',hint:'Equip Moonsteel Tanto',stat:'grace',pass:'The blade hums in your hand, light as a promise.',fail:'It is heavier than it looks, but your grip steadies as the silver veins wake.',next:'crossroads',item:'moonsteel',bonus:true},{text:'Ask the empty forge what it wants from you.',hint:'Spirit check',stat:'heart',pass:'A voice in the coals asks only that you remember its name: Akari.',fail:'The coals cool. You find a sharp little knife wrapped in a smith’s cloth.',next:'crossroads',item:'moonsteel',roll:true}]},
      crossroads:{chapter:'Act II · The hollow mountain',eyebrow:'05 / The split in the path',title:'Two ways through the dark',art:'鳥',text:`The tunnel forks around an underground lake. On one side, a rope bridge sways above a starless drop. On the other, a narrow passage exhales a steady, warm wind.\n\nA line of tiny footprints leads to the bridge. They stop halfway across.`,choices:[{text:'Cross the bridge, keeping your eyes on the far shore.',hint:'Grace check',stat:'grace',pass:'You move with the ropes, not against them. The dark below never gets a chance to learn your name.',fail:'A plank gives way. You catch the rope with both hands and haul yourself up, breathless.',next:'veil',roll:true},{text:'Follow the warm wind into the narrow passage.',hint:'Insight check',stat:'wit',pass:'You find a hidden stair and a mantle folded in a dry alcove.',fail:'The passage loops back on itself, but a hidden alcove holds a dark, beautiful mantle.',next:'veil',roll:true,item:'mantle',bonus:true}]},
      veil:{chapter:'Act II · The hollow mountain',eyebrow:'06 / The memory lake',title:'The face beneath the water',art:'◌',text:`Across the lake, a pale figure waits in the mist. Its face is yours, except for the thin crack of moonlight running from temple to chin.\n\nIt asks: <em>“If the world forgets you, what should remain?”</em> Beneath the water, something bright answers with a pulse.`,choices:[{text:'Reach into the water and take the light.',hint:'Spirit check · possible relic',stat:'heart',pass:'The lake gives up a small moon-shard. Its warmth gathers around you like a second heartbeat.',fail:'The cold steals your breath, but your fingers close around a glowing shard.',next:'sanctum',item:'bell',roll:true},{text:'Tell your reflection the truth you have never said aloud.',hint:'Insight check',stat:'wit',pass:'The cracked reflection smiles. A pale foxfire pools in your palm.',fail:'The reflection turns away. The foxfire still finds its way to your hand.',next:'sanctum',item:'bell',roll:true}]},
      sanctum:{chapter:'Act III · The name of the moon',eyebrow:'07 / The sealed sanctum',title:'A gate made of rain',art:'鳥居',text:`The final gate is built from falling water. Behind it waits a vast silhouette, crowned with antlers of broken moonlight. A discarded guard’s coat lies beside the threshold, still warm.\n\nThe figure speaks your name—perfectly, though you have not said it aloud in this place.`,choices:[{text:'Wrap yourself in the guard’s lacquered coat and step through.',hint:'Equip Oni-Bone Guard',stat:'might',pass:'The coat’s old owner stands a little taller in your memory.',fail:'The buckles fight you, then click shut. The coat is yours now.',next:'heart',item:'oni',bonus:true},{text:'Slip through the water-gate before it can finish speaking.',hint:'Grace check',stat:'grace',pass:'You’re through before the last syllable leaves its mouth.',fail:'The water closes around you like a curtain. You push through, soaked but whole.',next:'heart',roll:true}]},
      heart:{chapter:'Finale · The hollow bell',eyebrow:'08 / The heart of the mountain',title:'The moon-eater',art:'☯',text:`At the mountain’s heart, the silhouette resolves into a great white wolf. A missing moon-shard glows between its teeth. Its eyes are tired, not cruel.\n\n<em>“The village gave me their grief,”</em> it says. <em>“I kept it safe. Now I cannot put it down.”</em> The air trembles. Your answer will become the ending of this story.`,choices:[{text:'Meet its gaze and ask it to share the burden.',hint:'Spirit · compassionate ending',stat:'heart',pass:'You hold out your hand. The wolf lowers its head, and the moon remembers how to be whole.',fail:'Your voice shakes, but the wolf hears the kindness beneath it. The shard begins to glow.',next:'ending',roll:true,ending:'mercy'},{text:'Draw your weapon. Free the shard, even if it must hurt.',hint:'Might · resolute ending',stat:'might',pass:'Moonsteel sings. The wolf yields the shard—not defeated, but finally released.',fail:'The blow glances aside. The wolf sees your resolve and lets the shard fall between you.',next:'ending',roll:true,ending:'resolve'},{text:'Ring the foxfire bell and sing the station’s last song.',hint:'Insight · secret ending',stat:'wit',pass:'The bell and your voice find the lost note. The wolf remembers the way home.',fail:'The first notes are ragged. Then the mountain sings with you, and the wolf remembers.',next:'ending',roll:true,ending:'secret'}]}
    };
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function effective(){const out={...state.base};Object.values(state.gear).forEach(item=>{if(item)Object.entries(item.bonus).forEach(([k,v])=>out[k]+=v)});Object.keys(out).forEach(k=>out[k]=Math.max(0,Math.min(999,out[k])));return out}
    function save(){try{localStorage.setItem('moonfall-save',JSON.stringify(state))}catch(e){}}
    function addLog(text){state.log.unshift({step:state.step,text});state.log=state.log.slice(0,20)}
    function startGame(){state.name=$('#hero-name').value.trim().slice(0,20)||'Aoi';state.base={...archetypes[state.archetype].stats};const q=qualities[state.quality].mod;Object.keys(q).forEach(k=>state.base[k]+=q[k]);state.started=true;state.step=0;state.scene='gate';state.log=[];state.gear={weapon:null,charm:null,coat:null};state.ending=false;state.mood='calm';addLog(`${state.name} descended toward the hollow mountain.`);save();render()}
    function statMarkup(){const values=effective();return Object.entries(statNames).map(([key,label])=>`<div class="stat"><div class="stat-top"><span class="stat-name">${label}</span><span class="stat-value">${values[key]}<span style="color:#747885"> / 999</span></span></div><div class="stat-track"><div class="stat-fill" style="width:${Math.max(3,values[key]/999*100)}%"></div></div></div>`).join('')}
    function gearMarkup(){const slots=[['weapon','⚔','Weapon'],['charm','✧','Charm'],['coat','◈','Outerwear']];return slots.map(([key,icon,label])=>{const item=state.gear[key];return `<div class="equip-row"><span class="equip-icon">${item?item.icon:icon}</span><div class="equip-meta"><div class="equip-slot">${label}</div><div class="equip-name ${item?'':'empty-equip'}">${item?esc(item.name):'Nothing equipped'}</div></div></div>`}).join('')}
    function layout(content){return `<div class="shell"><header class="topbar"><div class="brand"><span class="brand-mark">☾</span> MOONFALL <span style="color:#747784;font-weight:400">/ TEXT ADVENTURE</span></div><div class="edition">A LITTLE STORY ABOUT WHAT WE CARRY</div><div class="top-actions"><button class="quiet-btn" onclick="openJournal()">Journal</button><button class="quiet-btn" onclick="newGamePrompt()">New game</button></div></header><div class="layout"><aside class="sidebar"><section class="card profile"><div class="section-label">Your traveler</div><div class="portrait-wrap"><div class="portrait ${state.archetype}" data-mood="${state.mood||'calm'}"><span class="glint"></span></div><span class="portrait-tag">LV. 01</span></div><div class="profile-info"><div class="hero-name">${esc(state.name)}</div><div class="hero-title">${archetypes[state.archetype].label} · ${qualities[state.quality].label}</div></div><div class="trait-line">“${qualities[state.quality].desc}”</div><div class="traits"><span class="trait">${archetypes[state.archetype].label}</span><span class="trait">${qualities[state.quality].label}</span></div></section><section class="card stats"><div class="card-head"><span class="section-label">Attributes</span><span class="score-cap">0—999</span></div>${statMarkup()}<div class="stat-note">Gear bonuses included · checks roll 0—999</div></section><section class="card inventory"><div class="card-head"><span class="section-label">Loadout</span><span class="score-cap">${Object.values(state.gear).filter(Boolean).length} / 3</span></div>${gearMarkup()}</section></aside><main class="main">${content}</main></div></div><div class="toast" id="toast"></div>`}
    function setup(){const a=Object.entries(archetypes).map(([key,x])=>`<button class="select-option ${state.archetype===key?'selected':''}" onclick="pick('archetype','${key}')"><b>${x.label}</b><small>${x.desc}</small></button>`).join('');const q=Object.entries(qualities).map(([key,x])=>`<button class="select-option ${state.quality===key?'selected':''}" onclick="pick('quality','${key}')"><b>${x.label}</b><small>${x.desc}</small></button>`).join('');return `<div class="setup-screen"><section class="modal setup-modal"><div class="modal-kicker">A moonlit text adventure</div><h1>The Hollow Bell</h1><p>In a village the world has forgotten, the moon is breaking. Before you descend beneath the shrine, decide who is making the journey. Your choices shape the numbers behind every daring moment.</p><label class="form-label" for="hero-name">What should we call you?</label><input id="hero-name" class="name-input" maxlength="20" placeholder="Aoi" value="${esc(state.name||'')}" autocomplete="off" oninput="state.name=this.value.slice(0,20)"><span class="form-label">Choose your path</span><div class="option-grid">${a}</div><span class="form-label">And the way you meet the world</span><div class="option-grid">${q}</div><button class="primary wide" onclick="startGame()">Begin the descent&nbsp; →</button><p class="mini-note">Four attributes, each scored from 0 to 999. Equipment changes your odds. Nothing is lost when a roll goes wrong; the story simply takes another shape.</p></section></div>`}
    function endingView(){const endings={mercy:{title:'A moon made whole',badge:'THE KINDNESS ENDING',text:`The great wolf presses its forehead to your palm. Its grief pours through you—not as pain, but as rain after a long drought. One by one, the lost memories find their owners. Above Tsukigane, the moon closes its silver seam.\n\nAt dawn, a train arrives at the forgotten station. The wolf waits on the platform beside you, no longer carrying the whole village alone.`},resolve:{title:'The light we set free',badge:'THE RESOLUTE ENDING',text:`Your blade rings once, clear as a bell. The wolf’s antlers crumble into a storm of silver moths; the moon-shard rests in your hands, warm and unbroken. The mountain exhales.\n\nYou return to Tsukigane as the sky pales. No one remembers the wolf, but every doorstep is dusted with bright, impossible moonlight.`},secret:{title:'The song after midnight',badge:'THE SECRET ENDING',text:`The foxfire bell answers your song. The white wolf becomes a thousand blue sparks, swirling upward through the mountain as if the night itself has remembered how to dance.\n\nAt the station, the departure board lights up for the first time in years. A new line appears: <em>Home — now boarding.</em> You laugh, and the moon laughs with you.`}};const d=endings[state.ending]||endings.mercy;return `<div class="eyebrow">The last note</div><span class="ending-badge">${d.badge}</span><h1 class="story-title">${d.title}</h1><div class="scene-art" aria-hidden="true">☾</div><div class="story-copy">${d.text.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div><p style="font:10px var(--mono);color:#bfa987;margin-top:22px">${esc(state.name)} · ${Object.values(state.gear).filter(Boolean).map(g=>g.name).join(' / ')||'No equipment'} · ${state.step} choices made</p><button class="primary" style="margin-top:12px" onclick="resetGame()">Begin another journey ↻</button>`}
    function storyView(){const sc=scenes[state.scene];const dots=Array.from({length:8},(_,i)=>`<span class="progress-dot ${i<Math.min(state.step,8)?'done':''}"></span>`).join('');let body='';if(state.result){const r=state.result;body=`<div class="eyebrow">${r.success?'✦ The moment turns':'✧ The moment passes'}</div><h1 class="story-title">${r.title||'The story moves'}</h1><div class="story-copy">${r.text.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div>${r.roll!==undefined?`<div class="roll-result ${r.success?'success':'fail'}">${r.statLabel} check · roll <strong>${r.roll}</strong> against <strong>${r.score}</strong> ${r.success?'— success':'— missed by '+(r.roll-r.score)}</div>`:''}${r.reaction?`<div class="equip-reaction">${r.reaction}</div>`:''}<button class="primary" style="margin-top:22px" onclick="continueStory()">${r.ending?'Enter the ending':'Continue'} &nbsp;→</button>`}else if(state.scene==='ending'){body=endingView()}else{body=`<div class="eyebrow">${sc.eyebrow}</div><div class="scene-art" aria-hidden="true">${sc.art}</div><h1 class="story-title">${sc.title}</h1><div class="story-copy">${sc.text.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div><div class="choices">${sc.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><span class="choice-key">0${i+1}</span><span class="choice-text">${c.text}</span><span class="choice-hint">${c.hint||''}</span></button>`).join('')}</div>`}return `<div class="chapter-line"><span class="chapter-no">${String(Math.min(state.step+1,8)).padStart(2,'0')}</span><span class="chapter-rule"></span><span class="chapter-name">${sc?.chapter||'Epilogue · The way home'}</span></div><section class="story-card"><div class="story-inner">${body}</div><div class="story-footer"><span>TSUKIGANE · ${String(state.step+1).padStart(2,'0')}</span><div class="chapter-progress">${dots}</div><span>MOONFALL</span></div></section>`}
    function render(){const app=$('#app');if(!app)return;app.innerHTML=state.started?layout(storyView()):setup()}
    function choose(index){const sc=scenes[state.scene];if(!sc||state.result)return;const c=sc.choices[index];if(!c)return;let success=true,roll,score,statLabel='';if(c.stat){const values=effective();score=values[c.stat]||0;roll=Math.floor(Math.random()*1000);success=roll<score;statLabel=statNames[c.stat]}const text=c.stat?(success?c.pass:c.fail):(c.pass||c.fail||'You make your choice, and the story moves forward.');let reaction='';const itemKey=c.item||c.gain;if(itemKey&&items[itemKey]){const item=items[itemKey];if(state.gear[item.slot]!==item){state.gear[item.slot]=item;reaction=item.reaction;state.mood=success?'pleased':'determined'}}else if(c.stat){state.mood=success?'pleased':'wary'}state.step++;state.scene=c.next;state.ending=c.ending||false;state.result={title:success?'Your choice takes root':'The path answers differently',text,success,roll,score,statLabel,reaction,ending:!!c.ending};addLog(`${sc.title}: ${text}${itemKey&&items[itemKey]?' (obtained '+items[itemKey].name+')':''}`);save();render()}
    function continueStory(){if(!state.result)return;if(state.result.ending){state.scene='ending';state.ending=true}state.result=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}
    function openJournal(){const old=$('#journal-overlay');if(old)old.remove();const overlay=document.createElement('div');overlay.id='journal-overlay';overlay.className='setup-screen';overlay.style.zIndex='20';overlay.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="journal-title"><button class="quiet-btn" style="float:right" onclick="document.querySelector('#journal-overlay').remove()" aria-label="Close journal">Close ✕</button><div class="modal-kicker">Your record of the descent</div><h1 id="journal-title">Journey journal</h1><p>${esc(state.name||'Traveler')} · ${state.step} choice${state.step===1?'':'s'} made</p><div style="max-height:48vh;overflow:auto;margin:18px 0">${state.log.length?state.log.map(entry=>`<article style="padding:12px 0;border-top:1px solid #ffffff16"><small style="font:9px var(--mono);color:var(--gold)">STEP ${String(entry.step).padStart(2,'0')}</small><p style="margin:6px 0;color:#d2cfd0;line-height:1.6">${esc(entry.text)}</p></article>`).join(''):'<p class="empty-equip">Your journey has not yet begun.</p>'}</div><button class="primary" onclick="document.querySelector('#journal-overlay').remove()">Return to the story</button></section>`;overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});document.body.appendChild(overlay)}
    function newGamePrompt(){if(!state.started){render();return}if(window.confirm('Begin a new journey? Your current progress will be replaced.'))resetGame()}
    function resetGame(){state.started=false;state.name='';state.base={};state.archetype='wanderer';state.quality='bright';state.gear={weapon:null,charm:null,coat:null};state.scene='gate';state.step=0;state.log=[];state.ending=false;state.result=null;state.mood='calm';try{localStorage.removeItem('moonfall-save')}catch(e){}render();window.scrollTo({top:0,behavior:'smooth'})}
    function pick(kind,key){if(kind==='archetype'&&archetypes[key])state.archetype=key;if(kind==='quality'&&qualities[key])state.quality=key;render()}
    try{const saved=JSON.parse(localStorage.getItem('moonfall-save')||'null');if(saved&&saved.started&&archetypes[saved.archetype]&&qualities[saved.quality]&&(scenes[saved.scene]||saved.scene==='ending')){Object.assign(state,saved);state.gear={weapon:null,charm:null,coat:null,...(saved.gear||{})};state.log=Array.isArray(saved.log)?saved.log:[]}}catch(e){}
    render();document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#journal-overlay')?.remove();if(!state.started||state.result||state.scene==='ending'||e.target.matches('input,textarea'))return;if(e.key==='1'||e.key==='2'){e.preventDefault();choose(Number(e.key)-1)}});
  </script>
</body>
</html>
